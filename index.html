    <script>
      // Canonical-domain redirect: force visitors on pages.dev / lovable.app preview
      // hostnames to the official domain, preserving path, query and hash.
      (function () {
        try {
          var h = window.location.hostname;
          if (/(^|\.)pages\.dev$/i.test(h)) {
            var target = 'https://alazharscholarunion.it' + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) { /* no-op */ }
      })();
    </script>

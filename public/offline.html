<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل — اتحاد علماء الأزهر</title>
    <meta name="theme-color" content="#367A2E" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        background: #F7F5EF;
        color: #1f2a1c;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #ffffff;
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 10px 40px -10px rgba(54, 122, 46, 0.25);
        border: 1px solid rgba(54, 122, 46, 0.12);
      }
      img { width: 84px; height: 84px; object-fit: contain; margin: 0 auto 16px; display: block; }
      h1 { font-size: 22px; margin: 0 0 12px; color: #367A2E; }
      p { font-size: 16px; line-height: 1.7; margin: 0 0 24px; color: #4a5249; }
      button {
        background: #367A2E;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover, button:focus { background: #2a6024; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.png" alt="اتحاد علماء الأزهر" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>تعذّر تحميل الصفحة. تحقّق من اتصالك بالإنترنت ثم حاول مجددًا.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
